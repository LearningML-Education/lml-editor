name: Dispatch public deploy

on:
  push:
    tags:
      - "*"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and integration tests
        run: bun run test

  dispatch:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to lml-editor
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_DISPATCH_TOKEN }}
          TARGET_REPO: LearningML-Education/lml-editor
          EVENT_TYPE: lml-editor-deploy
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing PUBLIC_REPO_DISPATCH_TOKEN"
            exit 1
          fi

          payload=$(printf '{"event_type":"%s","client_payload":{"tag":"%s","source_repo":"%s","sha":"%s"}}' \
            "$EVENT_TYPE" "$TAG_NAME" "$SOURCE_REPO" "$SOURCE_SHA")

          curl -f -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$payload"
