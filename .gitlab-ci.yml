---
stages:
  - check
  - build

variables:  
  DOCKER_REGISTRY: registry.gitlab.com/ # atención a la barra final, ES NECESARIA!
  DOCKER_IMAGE: docker:latest
  DOCKER_DIND_IMAGE: docker:dind
  BUN_IMAGE: oven/bun:1.3.6
  IMAGE_NAME: $CI_REGISTRY_IMAGE/lml-editor

tests:
  stage: check
  image: $BUN_IMAGE
  script:
    - bun install --frozen-lockfile
    - bun run test
    - bunx playwright install --with-deps chromium
    - bun run test:e2e
  only:
    - main

build:
  stage: build
  image: $DOCKER_IMAGE
  services:
    - $DOCKER_DIND_IMAGE
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

      docker build --pull -t $IMAGE_NAME:$CI_COMMIT_REF_NAME .
      
      docker push $IMAGE_NAME:$CI_COMMIT_REF_NAME
  only:
    - main
